[package]
name = "buddy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.1.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
