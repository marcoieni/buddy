name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check formatting
        run: npx --yes prettier@3.9.6 --check .

      - name: Set up just
        uses: extractions/setup-just@v4.0.0

      - name: Install Lima CLI
        env:
          LIMA_VERSION: v2.2.0
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="lima-${LIMA_VERSION#v}-Linux-x86_64.tar.gz"
          gh release download "$LIMA_VERSION" \
            --repo lima-vm/lima \
            --pattern "$archive"
          gh attestation verify "$archive" --owner lima-vm
          sudo tar -C /usr/local -xzf "$archive"

      - name: Validate
        run: just validate
