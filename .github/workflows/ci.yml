name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up just
        uses: extractions/setup-just@v4.0.0

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1.1.0
        with:
          version: latest
          ssh: false

      - name: Validate
        run: just validate
